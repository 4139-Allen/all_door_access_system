; ========== ESP32-S3 版本 ==========
[env:esp32-s3-dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_ESP32S3
build_src_filter = +<device_id001.cpp>
lib_deps =
    PubSubClient@^2.8

; ========== ESP-01S (ESP8266) 版本 ==========
[env:esp01s]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 9600
upload_speed = 115200
board_build.flash_mode = dout
build_flags =
    -Wl,-Teagle.flash.1m.ld
    -DBOARD_ESP01S
src_filter = +<device_id_002.cpp>
lib_deps =
    PubSubClient@^2.8

; 烧录时选择环境：
;   ESP32-S3:  pio run -e esp32-s3-dev -t upload --upload-port COM3
;   ESP-01S:   pio run -e esp01s -t upload --upload-port COM3
