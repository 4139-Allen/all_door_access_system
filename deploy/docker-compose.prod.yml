# ============================================================
# 正式环境 docker-compose（从镜像仓库拉取）
# 用于 Jenkins 自动部署，不用本地 build
# ============================================================

services:
  # ---------- 基础服务（官方镜像，直接从 Docker Hub 拉取）----------
  mysql:
    image: mysql:8.0
    container_name: door-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 784m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DB:-door_access_system}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: door-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: door-mqtt
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  # ---------- 你的应用服务（从阿里云镜像仓库拉取）----------
  fastapi:
    image: ${REGISTRY:-crpi-m44y6y44d0d23rbk.cn-hongkong.personal.cr.aliyuncs.com}/${NAMESPACE:-door-system}/door-fastapi:${IMAGE_TAG:-latest}
    container_name: door-api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - MQTT_BROKER_HOST=mosquitto
      - MYSQL_HOST=mysql
      - REDIS_HOST=redis
    volumes:
      - logs-data:/app/logs
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: ${REGISTRY:-registry.cn-hangzhou.aliyuncs.com}/${NAMESPACE:-door-system}/door-frontend:${IMAGE_TAG:-latest}
    container_name: door-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../ssl/doorlink.top.pem:/etc/nginx/ssl/doorlink.top.pem:ro
      - ../ssl/doorlink.top.key:/etc/nginx/ssl/doorlink.top.key:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      fastapi:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  logs-data:
  uploads-data:
