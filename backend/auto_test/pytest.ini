[pytest]
testpaths = cases unit
python_files = test_*.py
python_classes = Test*
python_functions = test_

# 用例标记 & 说明
markers =
    smoke: 冒烟测试（部署后快速验证核心功能）
    slow: 慢速测试（涉及外部 API 调用，如 AI）
    destructive: 破坏性测试（创建/修改/删除数据，需清理）
    auth: 认证相关测试
    permission: 权限控制测试
    db_check: 需要开启 --db-check 的数据库校验测试
    order_dependent: 依赖其他测试用例执行顺序

# 默认参数
addopts =
    -v
    --tb=short
    --strict-markers
    --alluredir=./report

# 日志
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 清理缓存
cache_dir = .pytest_cache
