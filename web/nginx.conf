# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name doorlink.top www.doorlink.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name doorlink.top www.doorlink.top;

    # SSL 证书
    ssl_certificate /etc/nginx/ssl/doorlink.top.pem;
    ssl_certificate_key /etc/nginx/ssl/doorlink.top.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # 允许上传请求体最大 10MB（头像当前上限 1MB，预留后续放宽空间；
    # 精确校验由后端完成，超上限返回规范 JSON 400，而非 nginx 默认 413 HTML）
    client_max_body_size 10m;

    # Vue Router history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态文件（头像等）
    location /uploads/ {
        proxy_pass http://fastapi:8000/uploads/;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 代理
    location /api/ws {
        proxy_pass http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}